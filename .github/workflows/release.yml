name: release

on:
  push:
    # "1.0.0" and "v1.0.0" are both release tags
    tags: ["[0-9]*.[0-9]*.[0-9]*", "v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static:
    timeout-minutes: 30
    name: static ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
          - { arch: armv7,   platform: linux/arm/v7 }
          - { arch: i686,    platform: linux/386 }
          - { arch: ppc64le, platform: linux/ppc64le }
          - { arch: s390x,   platform: linux/s390x }
          - { arch: riscv64, platform: linux/riscv64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: static musl build, tests, strip
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e RELEASE_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}" -v "$PWD:/src" -w /src alpine:3.20 sh -ec '
            apk add --no-cache build-base make procps coreutils bash
            make WERROR=1 CFLAGS="-O2 -g" LDFLAGS="-static" check SKIP_INTEGRATION=1
            make clean
            make CFLAGS="-O2" LDFLAGS="-static" all
            strip build/cpulimit
            file build/cpulimit 2>/dev/null || true
            ./build/cpulimit -V'
          mkdir -p dist
          cp build/cpulimit dist/cpulimit-${{ matrix.arch }}-linux-musl
          (cd dist && sha256sum cpulimit-${{ matrix.arch }}-linux-musl > cpulimit-${{ matrix.arch }}-linux-musl.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cpulimit-${{ matrix.arch }}
          path: dist/*

  publish:
    timeout-minutes: 30
    needs: static
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^## \[/ { exit } on' src/CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $v" >&2; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
