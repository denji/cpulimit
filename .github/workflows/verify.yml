name: verify

on:
  push:
    branches: [master, main, modernize]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CPULIMIT_SKIP_TIMING: "1"

jobs:
  sanitizers:
    timeout-minutes: 30
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "gcc asan+ubsan",   cc: gcc,   san: "address,undefined,leak" }
          - { name: "clang asan+ubsan", cc: clang, san: "address,undefined,leak" }
          # unlike gcc, clang's integer sanitizer also traps unsigned wrap-around and implicit
          # conversions: the number-parsing code is written so that none of them occurs
          - { name: "clang integer",    cc: clang, san: "undefined,integer,nullability" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          make CC=${{ matrix.cc }} WERROR=1 \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=${{ matrix.san }} -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=${{ matrix.san }}" check

  valgrind:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make WERROR=1 CFLAGS="-O1 -g" all
      - name: unit tests under valgrind
        run: |
          make CFLAGS="-O1 -g" $(for t in process_iterator util limiter procfs_parse group list cli_parse lock; do printf 'build/test/%s_test ' $t; done)
          for t in process_iterator util limiter procfs_parse group list cli_parse lock; do
            bash tools/ci_run.sh "valgrind $t" valgrind -q --leak-check=full --error-exitcode=99 build/test/${t}_test
          done
      - name: stress test (churn, 300 children, valgrind attach and command mode)
        run: make stress

  stress:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make WERROR=1 CFLAGS="-O2 -g" stress LOAD_SECS=30

  static-analysis:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck clang-tools
      - name: gcc -fanalyzer and clang-tidy
        run: make analyze
      - name: cppcheck
        run: |
          bash tools/ci_run.sh cppcheck cppcheck --error-exitcode=1 --inline-suppr --enable=warning,portability,performance \
            --std=c99 --suppress=missingIncludeSystem -I src \
            $(find src -name '*.c' ! -path 'src/platform/macos/*' ! -path 'src/platform/freebsd/*' ! -path 'src/platform/solaris/*')
      - name: scan-build
        run: |
          make clean
          scan-build --status-bugs -disable-checker security.insecureAPI.DeprecatedOrUnsafeBufferHandling make all

  codeql:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-and-quality
      - run: make all
      - uses: github/codeql-action/analyze@v3

  # The harnesses in verif/ as ordinary programs: every nondeterministic input is drawn at random
  # (with a bias to boundary values), the assertions are the properties. This is random testing of
  # the same statements the bounded model checker gets (workflow cbmc.yml), over the full input
  # range. It proves nothing, and it must pass on every push.
  verif-sim:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/ci_run.sh "verif-sim" make verif-sim

  mutation:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/mutation.sh

  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make coverage COV_MIN_LINES=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/cov/uncovered.txt
